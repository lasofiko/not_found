[target]
route_id = "ust_luga_kaliningrad_ferry"
geography = "Паромная линия Усть-Луга — Калининград; не полный коридор"
unit = "tonnes"
granularity = "year"
mode = "sea"
directions = ["inbound", "outbound"]
first_historical_year = 2015
last_historical_year = 2023
forecast_end_year = 2030
scope_status = "experimental_line_demo"

[evaluation]
strategy = "rolling_origin"
models = ["naive", "drift", "ses"]
baseline = "naive"
development_years = [2020, 2021]
holdout_years = [2022, 2023]
selection_metric = "MAE"
metrics = ["MAE", "WAPE"]
tie_break_order = ["naive", "drift", "ses"]

[forecast]
interval_levels = [80, 95]
nonnegative = true
