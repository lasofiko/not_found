[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baltic-balance-2030"
version = "0.1.0"
description = "Каркас прогноза грузопотоков Калининградской области"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
data = ["xlrd==2.0.2"]
notebooks = [
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
    "pandas>=2.2,<4",
    "matplotlib>=3.8,<4",
    "nbclient>=0.10,<1",
    "nbconvert>=7,<8",
]

[tool.setuptools.packages.find]
include = ["backend*", "pipeline*", "ml*"]
